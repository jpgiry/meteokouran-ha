# Generated by homeassistant/blueprints.mjs — edit the generator, not this file.
blueprint:
  name: "MétéoKouran — Orange : réseau contraint"
  author: MétéoKouran
  description: >-
    Éteint les appareils choisis quand le réseau électrique est **contraint** (orange), pour réduire la consommation. Les climatiseurs peuvent être réglés à une température plutôt que coupés.

    **Climatiseurs** : ceux que vous choisissez dans « Climatisation » ne sont pas coupés mais réglés à la température choisie (25 °C par défaut), s'ils sont en marche.


    Se déclenche quand le signal de l'heure (`sensor.meteokouran_signal_horaire`)
    passe à l'orange (réseau contraint), puis quand il en sort. Données d'EDF Réunion
    (source : EDF) rediffusées par MétéoKouran : **ce n'est pas une alerte
    officielle**.


    Rien ne se passe quand les données sont indisponibles (panne de l'API)
    ni au redémarrage de Home Assistant : il faut un vrai changement de
    signal.


    **Remettre l'état d'avant** : l'état des appareils est mémorisé à
    l'entrée dans le niveau et rétabli à la sortie. Ce souvenir est perdu si
    Home Assistant redémarre pendant le niveau : rien n'est alors rétabli.


    Nécessite l'intégration MétéoKouran (Home Assistant 2026.10.0 ou plus récent).
  domain: automation
  homeassistant:
    min_version: 2026.10.0
  input:
    appareils:
      name: Appareils
      description: >-
        Appareils à éteindre quand le signal passe à l'orange.
      selector:
        entity:
          multiple: true
          filter:
            - domain:
                - switch
                - light
                - fan
                - climate
                - water_heater
                - input_boolean
    climatisation:
      name: Climatisation
      icon: mdi:air-conditioner
      collapsed: true
      input:
        climatiseurs:
          name: Climatiseurs à régler plutôt qu'à couper
          description: >-
            Facultatif. Ces climatiseurs, s'ils sont en marche, sont réglés à la
            température ci-dessous au lieu d'être éteints. Inutile de les choisir
            aussi dans « Appareils ».
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: climate
        consigne:
          name: Température des climatiseurs
          default: 25
          selector:
            number:
              min: 16
              max: 30
              step: 0.5
              unit_of_measurement: °C
              mode: box
    a_la_sortie:
      name: À la sortie du niveau
      icon: mdi:exit-run
      collapsed: true
      input:
        sortie:
          name: Quand le signal quitte l'orange
          description: >-
            « Remettre l'état d'avant » rétablit l'état mémorisé à l'entrée (perdu
            si Home Assistant redémarre pendant le niveau). « Rallumer les appareils »
            ne touche pas aux climatiseurs. Un même appareil dans deux
            automatisations MétéoKouran : au changement de signal, les deux agissent
            en même temps et l'ordre n'est pas garanti.
          default: rien
          selector:
            select:
              mode: list
              options:
                - value: rien
                  label: Ne rien faire
                - value: restaurer
                  label: Remettre l'état d'avant
                - value: inverse
                  label: Rallumer les appareils
    plage_horaire:
      name: Plage horaire
      icon: mdi:clock-outline
      collapsed: true
      input:
        heure_debut:
          name: À partir de
          description: >-
            Facultatif. N'agit que si le signal passe à l'orange dans cette plage.
            Laissez 00:00 et 00:00 pour toute la journée.
          default: "00:00:00"
          selector:
            time:
        heure_fin:
          name: Jusqu'à
          default: "00:00:00"
          selector:
            time:
    notification:
      name: Notification
      icon: mdi:cellphone-message
      collapsed: true
      input:
        notifications:
          name: Prévenir sur
          description: >-
            Facultatif. Téléphones ou services de notification à prévenir à l'entrée
            dans le niveau (message avec la mention « Source : EDF » et l'heure des
            données).
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: notify
    cyclone:
      name: Cyclone
      icon: mdi:weather-hurricane
      collapsed: true
      input:
        ignorer_cyclone:
          name: Ne rien faire pendant un cyclone signalé par EDF
          description: >-
            Selon `binary_sensor.meteokouran_cyclone_en_cours`. Un état mémorisé
            avant le cyclone est quand même rétabli à la sortie.
          default: false
          selector:
            boolean:

# restart: the latest signal change wins; the actions take no time, so
# nothing worth finishing is ever interrupted.
mode: restart
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: sensor.meteokouran_signal_horaire
    from:
      - vert
      - bleu
      - rouge
    to: orange
    id: entree
  - trigger: state
    entity_id: sensor.meteokouran_signal_horaire
    from: orange
    to:
      - vert
      - bleu
      - rouge
    id: sortie
  # The API comes back on another level after an outage that hid the exit:
  # only a snapshot (restore) can tell that the level had been entered.
  - trigger: state
    entity_id: sensor.meteokouran_signal_horaire
    from:
      - unavailable
      - unknown
    to:
      - vert
      - bleu
      - rouge
    id: reprise

variables:
  appareils_choisis: !input appareils
  climatiseurs: !input climatiseurs
  consigne: !input consigne
  sortie: !input sortie
  heure_debut: !input heure_debut
  heure_fin: !input heure_fin
  notifications: !input notifications
  ignorer_cyclone: !input ignorer_cyclone
  appareils: "{{ appareils_choisis | reject('in', climatiseurs) | list }}"
  instantane: "scene.meteokouran_{{ this.entity_id.split('.')[1] }}"
  instantane_existe: "{{ expand(instantane) | count > 0 }}"
  # Time the level was entered: now on entry, the start of the left level on exit.
  debut_niveau: >-
    {{ (now() if trigger.id == 'entree' else as_local(trigger.from_state.last_changed)).strftime('%H:%M:%S') }}
  dans_plage: >-
    {% set d = (heure_debut ~ ':00')[:8] %}
    {% set f = (heure_fin ~ ':00')[:8] %}
    {% if d < f %}{{ d <= debut_niveau < f }}{% else %}{{ not (f <= debut_niveau < d) }}{% endif %}
  cyclone_bloque: "{{ ignorer_cyclone and is_state('binary_sensor.meteokouran_cyclone_en_cours', 'on') }}"

actions:
  - choose:
      - alias: Entrée dans le niveau
        conditions:
          - condition: template
            value_template: "{{ trigger.id == 'entree' and dans_plage and not cyclone_bloque }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ sortie == 'restaurer' and (appareils + climatiseurs) | count > 0 }}"
            then:
              - action: scene.create
                data:
                  scene_id: "{{ instantane.split('.')[1] }}"
                  snapshot_entities: "{{ appareils + climatiseurs }}"
          - if:
              - condition: template
                value_template: "{{ appareils | count > 0 }}"
            then:
              - action: homeassistant.turn_off
                continue_on_error: true
                target:
                  entity_id: "{{ appareils }}"
          - variables:
              climatiseurs_en_marche: >-
                {{ climatiseurs | reject('is_state', ['off', 'unavailable', 'unknown']) | list }}
          - if:
              - condition: template
                value_template: "{{ climatiseurs_en_marche | count > 0 }}"
            then:
              - action: climate.set_temperature
                continue_on_error: true
                target:
                  entity_id: "{{ climatiseurs_en_marche }}"
                data:
                  temperature: "{{ consigne }}"
          - if:
              - condition: template
                value_template: "{{ notifications | count > 0 }}"
            then:
              - action: notify.send_message
                continue_on_error: true
                target:
                  entity_id: "{{ notifications }}"
                data:
                  title: "🟠 Signal orange (réseau contraint)"
                  message: >-
                    {% set d = state_attr('sensor.meteokouran_signal_horaire', 'data') %}
                    {% set src = state_attr('sensor.meteokouran_signal_horaire', 'source') %}
                    {% set fin = states('sensor.meteokouran_prochain_changement') %}
                    {% set fin = fin if fin not in ['unknown', 'unavailable'] else (d.hour.end if d and d.hour else none) %}
                    Signal EDF « {{ d.hour.signal.label if d and d.hour else 'orange' }} »{% if fin %}
                    jusqu'à {{ as_timestamp(fin) | timestamp_custom('%H:%M') }}{% endif %} :
                    vos appareils choisis sont éteints.
                    Source : EDF{% if src and src.updated_at %}, données du
                    {{ as_timestamp(src.updated_at) | timestamp_custom('%d/%m %H:%M') }}{% endif %}.
      - alias: Sortie du niveau, état d'avant rétabli
        conditions:
          - condition: template
            value_template: "{{ trigger.id in ['sortie', 'reprise'] and sortie == 'restaurer' and instantane_existe }}"
        sequence:
          - action: scene.turn_on
            continue_on_error: true
            target:
              entity_id: "{{ instantane }}"
          - action: scene.delete
            target:
              entity_id: "{{ instantane }}"
      - alias: Sortie du niveau, action inverse
        conditions:
          - condition: template
            value_template: >-
              {{ trigger.id == 'sortie' and sortie == 'inverse' and dans_plage
                 and not cyclone_bloque and appareils | count > 0 }}
        sequence:
          - action: homeassistant.turn_on
            continue_on_error: true
            target:
              entity_id: "{{ appareils }}"
