name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        # Pinned to a commit of hacs/action (main, 2026-06-08): its latest tag
        # (22.5.0) dates from 2022. The action itself runs the image
        # ghcr.io/hacs/action:main, i.e. HACS' current checks.
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration

  validate-hassfest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Hassfest validation
        # Pinned to a commit of home-assistant/actions (master, 2026-10-26):
        # the action runs Home Assistant's own hassfest image.
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361
